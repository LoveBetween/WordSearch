<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Word Games</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body onload="initScrubble()"> <!-- initScrubble defined below -->
    <div class="top-buttons">
        <button onclick="showPage('page1')">Scrubble</button>
        <button onclick="showPage('page2')">Word Search</button>
    </div>

    <!-- PAGE 1: Scrubble -->
    <div id="page1" class="page active">
        <div class="leftScrubble">
            <div class="Scrubble">
                <p id="Score"></p>
            </div>
            <div class="Scrubble">
                <canvas id="scrabbleBoard" width="800" height="800"></canvas>
            </div>
            <div class="Scrubble">
                <canvas id="letterRack" width="350" height="50"></canvas>
                <button id="confirmPlay" class="button-21"> Confirmer mot</button>
            </div>
            <canvas id="dragged"></canvas>
        </div>
        <div class = "rightScrubbleyy">
            <div class="Scrubble">
                <p id="playedWords"></p>
            </div>
        </div>
        
    </div>

    <!-- PAGE 2: Word search -->
    <div id="page2" class="page">
        <div class="inputLetters">
            <input type="text" id="inputLetters" name="Letters">
            <div class="dropdown">
                <button onclick="dropDownFunction(this)" class="dropbtn">Langue</button>
                <div id="myDropdown" class="dropdown-content">
                    <button class="dropbtnchoice" onclick="changeLanguage('French')">Français</button>
                    <button class="dropbtnchoice" onclick="changeLanguage('English')">English</button>
                </div>
            </div>
        </div>
        <div class="outputWords">
            <p id="outputWords"><span> Enter some letters!<span> </p>
        </div>
    </div>

    <!-- Shared Scripts -->
    <script src="Lib/englishDictionary.js"></script>
    <script src="Lib/frenchDictionary.js"></script>
    <script src="Lib/Dawg.js"></script>

    <!-- Page 1 specific -->
    <script src="Scrubble/ScrubbleWordLib.js"></script>
    <script src="Scrubble/ScrubbleDisplayLib.js"></script>
    <script src="Scrubble/Scrubble.js"></script>
    <script>
        function showPage(pageId) {
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        function dropDownFunction(btn) {
            document.getElementById("myDropdown").classList.toggle("show");
        }

        // Only init Scrubble if canvas page is shown
        function initScrubble() {
            // Wait a moment before calling init() so the canvas exists
            setTimeout(() => {
                if (typeof init === 'function') init();
            }, 100);
        }
    </script>

    <!-- Page 2 specific -->
    <script src="WordSearch/WordSearch.js"></script>
</body>
</html>
